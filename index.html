<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Stoppo — stop the clock</title>
    <meta
      name="description"
      content="A frame-accurate reaction game. Tap the instant the screen lights up, or count the seconds out in the dark and stop the clock on the exact beat."
    />
    <meta name="theme-color" content="#04050b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Inlined so the very first paint is already the void — a white frame
         before the stylesheet lands would be a lie the game cannot afford. */
      html,
      body {
        margin: 0;
        background: #04050b;
        color: #e8feff;
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <main class="app">
      <section id="home" class="home">
        <div class="brand">
          <svg
            class="brand__mark"
            viewBox="0 0 64 64"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              cx="32"
              cy="32"
              r="22"
              fill="none"
              stroke="currentColor"
              stroke-width="4.5"
              opacity="0.45"
            />
            <line
              x1="32"
              y1="32"
              x2="32"
              y2="17"
              stroke="currentColor"
              stroke-width="4.5"
              stroke-linecap="round"
              opacity="0.85"
            />
            <circle cx="32" cy="10" r="7.5" fill="#04050b" />
            <circle cx="32" cy="10" r="4.5" fill="currentColor" />
          </svg>
          <h1 class="brand__name">Stoppo</h1>
          <p id="tagline" class="brand__tagline">Stop the clock.</p>
        </div>

        <div id="modes" class="modes" role="group" aria-label="Game mode">
          <button type="button" class="mode is-last" data-mode="reflex">
            <span class="mode__text">
              <span class="mode__row">
                <span class="mode__name" data-name="reflex">Reflex</span>
                <span class="mode__best" data-best="reflex">—</span>
              </span>
              <span class="mode__desc" data-desc="reflex">
                It lights up. You tap. Speed is all that counts.
              </span>
            </span>
            <span class="mode__go" aria-hidden="true">
              <svg class="icon icon-play" viewBox="0 0 24 24" fill="none">
                <path
                  d="M9 6l9 6-9 6z"
                  fill="currentColor"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>

          <button type="button" class="mode" data-mode="count">
            <span class="mode__text">
              <span class="mode__row">
                <span class="mode__name" data-name="count">Count</span>
                <span class="mode__best" data-best="count">—</span>
              </span>
              <span class="mode__desc" data-desc="count">
                A random 2–10s to count out in the dark. Early is burnt.
              </span>
            </span>
            <span class="mode__go" aria-hidden="true">
              <svg class="icon icon-play" viewBox="0 0 24 24" fill="none">
                <path
                  d="M9 6l9 6-9 6z"
                  fill="currentColor"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>

          <button
            type="button"
            class="mode"
            data-mode="lock"
            aria-expanded="false"
            aria-controls="lockrow"
          >
            <span class="mode__text">
              <span class="mode__row">
                <span class="mode__name" data-name="lock">Lock</span>
                <span class="mode__best" data-best="lock">—</span>
              </span>
              <span class="mode__desc" data-desc="lock">
                Pick one number of seconds and practise it until you own it.
              </span>
            </span>
            <span class="mode__go" aria-hidden="true">
              <svg class="icon icon-more" viewBox="0 0 24 24" fill="none">
                <path
                  d="M6 9l6 6 6-6"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>
        </div>

        <div id="lockrow" class="lockrow" hidden>
          <span id="secondsLabel" class="lockrow__label">How many seconds</span>
          <div
            id="chips"
            class="chips"
            role="group"
            aria-label="How many seconds"
          >
            <!-- populated at runtime -->
          </div>
        </div>

        <p id="fineprint" class="fineprint">
          Plays bright flashes on a dark screen. Sit this one out if that is a
          problem for you.
        </p>

        <div class="footer">
          <div id="lang" class="lang" role="radiogroup" aria-label="Language">
            <button
              type="button"
              class="lang__btn"
              data-locale="pl"
              role="radio"
              aria-checked="false"
            >
              PL
            </button>
            <button
              type="button"
              class="lang__btn"
              data-locale="en"
              role="radio"
              aria-checked="false"
            >
              EN
            </button>
          </div>
          <button type="button" id="clear" class="clear">Clear records</button>
        </div>
      </section>

      <section
        id="stage"
        class="stage"
        data-phase="idle"
        data-mode="reflex"
        hidden
      >
        <div class="core">
          <div class="waiter" aria-hidden="true">
            <span class="waiter__arc"></span>
          </div>
          <p id="cue" class="cue">Wait</p>
          <p id="cueSub" class="cue-sub"></p>
          <p id="cueTarget" class="cue-target"></p>
          <p id="counting" class="counting"></p>
        </div>

        <div id="verdict" class="verdict">
          <p id="verdictLabel" class="verdict__label"></p>

          <div id="dial" class="dial" role="img" aria-label="">
            <svg
              class="dial__svg"
              viewBox="0 0 200 200"
              aria-hidden="true"
              focusable="false"
            >
              <circle
                id="dialRing"
                class="dial__ring"
                cx="100"
                cy="100"
                r="62"
              />
              <circle
                id="dialDisc"
                class="dial__disc"
                cx="100"
                cy="100"
                r="62"
              />
            </svg>
            <span id="verdictNumber" class="dial__number">0</span>
          </div>

          <p id="verdictUnit" class="verdict__unit">ms</p>
          <p id="verdictRecord" class="verdict__record"></p>
          <p id="verdictDetail" class="verdict__detail"></p>
        </div>

        <div id="retry" class="retry">
          <button type="button" id="again" class="again">Again</button>
          <p id="againHint" class="retry__hint">
            or tap anywhere on the screen
          </p>
          <button type="button" id="back" class="back">Modes</button>
        </div>
      </section>
    </main>

    <div id="flash" class="flash" aria-hidden="true">
      <div class="flash__disc">
        <span id="flashWord" class="flash__word">Tap</span>
      </div>
    </div>

    <p id="live" class="sr-only" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
