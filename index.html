<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Stoppo — stop the clock</title>
    <meta
      name="description"
      content="A frame-accurate reaction game. Tap the instant the screen lights up, or count the seconds out in the dark and stop the clock on the exact beat."
    />
    <meta name="theme-color" content="#04050b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Inlined so the very first paint is already the void — a white frame
         before the stylesheet lands would be a lie the game cannot afford. */
      html,
      body {
        margin: 0;
        background: #04050b;
        color: #e8feff;
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <main class="app">
      <section id="home" class="home">
        <div class="brand">
          <svg
            class="brand__mark"
            viewBox="0 0 64 64"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              cx="32"
              cy="32"
              r="22"
              fill="none"
              stroke="currentColor"
              stroke-width="4.5"
              opacity="0.45"
            />
            <line
              x1="32"
              y1="32"
              x2="32"
              y2="17"
              stroke="currentColor"
              stroke-width="4.5"
              stroke-linecap="round"
              opacity="0.85"
            />
            <circle cx="32" cy="10" r="7.5" fill="#04050b" />
            <circle cx="32" cy="10" r="4.5" fill="currentColor" />
          </svg>
          <h1 class="brand__name">Stoppo</h1>
          <p class="brand__tagline">Stop the clock.</p>
        </div>

        <div class="modes" role="radiogroup" aria-label="Game mode">
          <button
            type="button"
            class="mode is-selected"
            data-mode="reflex"
            role="radio"
            aria-checked="true"
          >
            <span class="mode__row">
              <span class="mode__name">Reflex</span>
              <span class="mode__best" data-best="reflex">—</span>
            </span>
            <span class="mode__desc">
              It lights up. You tap. Nothing else in your head.
            </span>
          </button>

          <button
            type="button"
            class="mode"
            data-mode="count"
            role="radio"
            aria-checked="false"
          >
            <span class="mode__row">
              <span class="mode__name">Count</span>
              <span class="mode__best" data-best="count">—</span>
            </span>
            <span class="mode__desc">
              A random 2–10s to count out in the dark. Early is burnt.
            </span>
          </button>

          <button
            type="button"
            class="mode"
            data-mode="lock"
            role="radio"
            aria-checked="false"
          >
            <span class="mode__row">
              <span class="mode__name">Lock</span>
              <span class="mode__best" data-best="lock">—</span>
            </span>
            <span class="mode__desc">
              One interval you pick, over and over, until you own it.
            </span>
          </button>
        </div>

        <div id="lockrow" class="lockrow" hidden>
          <span class="lockrow__label">Interval</span>
          <div id="chips" class="chips" role="radiogroup" aria-label="Interval">
            <!-- populated at runtime -->
          </div>
        </div>

        <button type="button" id="play" class="play">
          <span class="play__label">Play</span>
          <span class="play__hint">or press space</span>
        </button>

        <p class="fineprint">
          Plays full-screen white flashes on a dark screen. Sit this one out if
          that is a problem for you.
        </p>
      </section>

      <section
        id="stage"
        class="stage"
        data-phase="idle"
        data-mode="reflex"
        hidden
      >
        <button type="button" id="back" class="back">Modes</button>

        <div class="core">
          <div class="ring" aria-hidden="true"></div>
          <p id="cue" class="cue">Hold steady</p>
          <p id="target" class="target"></p>
        </div>

        <div id="verdict" class="verdict">
          <p id="verdictLabel" class="verdict__label"></p>
          <p class="verdict__value">
            <span id="verdictNumber" class="verdict__number">0</span>
            <span id="verdictUnit" class="verdict__unit">ms</span>
          </p>
          <p id="verdictDetail" class="verdict__detail"></p>
          <p id="verdictBest" class="verdict__best"></p>
        </div>

        <button type="button" id="again" class="again">
          <span class="again__label">Again</span>
          <span class="again__hint">tap anywhere</span>
        </button>
      </section>
    </main>

    <div id="flash" class="flash" aria-hidden="true">
      <span class="flash__word">Tap</span>
    </div>

    <p id="live" class="sr-only" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
